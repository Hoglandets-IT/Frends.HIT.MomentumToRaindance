name: momentum-raindance-dev

services:
  postgres:
    image: postgres:17
    environment:
      # Disposable local development only. Never copy these credentials to production.
      POSTGRES_USER: momentum_admin
      POSTGRES_PASSWORD: momentum_dev_only
      POSTGRES_DB: momentum_tracking
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - momentum_tracking_data:/var/lib/postgresql/data
      - ./:/workspace/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentum_admin -d momentum_tracking"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  momentum_tracking_data:
