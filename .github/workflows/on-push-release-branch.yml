name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: momentum_tracking
          POSTGRES_USER: momentum_admin
          POSTGRES_PASSWORD: momentum_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momentum_admin -d momentum_tracking"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: momentum_tracking
      PGUSER: momentum_admin
      PGPASSWORD: momentum_ci_only
      MOMENTUM_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Database=momentum_tracking;Username=momentum_admin;Password=momentum_ci_only;SSL Mode=Disable'
      MOMENTUM_TEST_POSTGRES_RUNTIME: 'Host=127.0.0.1;Port=5432;Database=momentum_tracking;Username=momentum_tracking_runtime;Password=momentum_runtime_ci_only;SSL Mode=Disable'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build and test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          database/migrate.sh
          database/migrate.sh
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE momentum_tracking_runtime LOGIN PASSWORD 'momentum_runtime_ci_only'"
          database/operator.sh grant-runtime momentum_tracking_runtime
          psql -X -v ON_ERROR_STOP=1 -f database/tests/runtime-privileges.sql
          dotnet restore Frends.HIT.MomentumToRaindance.sln
          dotnet build Frends.HIT.MomentumToRaindance.sln --configuration Release --no-restore --warnaserror
          dotnet test tests/Frends.HIT.MomentumToRaindance.Tests/Frends.HIT.MomentumToRaindance.Tests.csproj --configuration Release --no-build

      - name: Pack release
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          dotnet pack Frends.HIT.MomentumToRaindance/Frends.HIT.MomentumToRaindance.csproj --configuration Release --no-restore --include-source --output artifacts /p:Version="$release_version"

      - name: Publish package
        env:
          PACKAGE_FEED_USER: ${{ secrets.FRENDS_NUGET_V2_FEED_USER }}
          PACKAGE_FEED_KEY: ${{ secrets.FRENDS_NUGET_V2_FEED_KEY }}
          PACKAGE_FEED_URL: ${{ secrets.FRENDS_NUGET_V2_FEED_URL }}
        run: |
          dotnet nuget add source --name hit-registry --store-password-in-clear-text --username "$PACKAGE_FEED_USER" --password "$PACKAGE_FEED_KEY" "$PACKAGE_FEED_URL"
          dotnet nuget push --source hit-registry 'artifacts/Frends.HIT.MomentumToRaindance.*.nupkg' --skip-duplicate

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*.nupkg
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
