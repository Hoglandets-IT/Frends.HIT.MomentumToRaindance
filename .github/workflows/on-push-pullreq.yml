name: Validate and publish

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: momentum_tracking
          POSTGRES_USER: momentum_admin
          POSTGRES_PASSWORD: momentum_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momentum_admin -d momentum_tracking"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: momentum_tracking
      PGUSER: momentum_admin
      PGPASSWORD: momentum_ci_only
      MOMENTUM_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Database=momentum_tracking;Username=momentum_admin;Password=momentum_ci_only;SSL Mode=Disable'
      MOMENTUM_TEST_POSTGRES_RUNTIME: 'Host=127.0.0.1;Port=5432;Database=momentum_tracking;Username=momentum_tracking_runtime;Password=momentum_runtime_ci_only;SSL Mode=Disable'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore
      run: dotnet restore Frends.HIT.MomentumToRaindance.sln
    - name: Migrate test database
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        database/migrate.sh
        database/migrate.sh
        psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE momentum_tracking_runtime LOGIN PASSWORD 'momentum_runtime_ci_only'"
        database/operator.sh grant-runtime momentum_tracking_runtime
        psql -X -v ON_ERROR_STOP=1 -f database/tests/runtime-privileges.sql
    - name: Build
      run: dotnet build Frends.HIT.MomentumToRaindance.sln --configuration Release --no-restore --warnaserror
    - name: Test
      run: dotnet test tests/Frends.HIT.MomentumToRaindance.Tests/Frends.HIT.MomentumToRaindance.Tests.csproj --configuration Release --no-build
    - name: Validate package
      run: dotnet pack Frends.HIT.MomentumToRaindance/Frends.HIT.MomentumToRaindance.csproj --configuration Release --no-build --output artifacts

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Build and publish
      uses: hoglandets-it/gha-dotnet-builder@main
      with:
        buildShell: bash
        buildVersion: VERSION
        incrementVersion: patch
        incrementVersionWriteback: "true"
        writebackName: "AutoPush"
        writebackEmail: "developer@hoglan.dev"
        buildConfiguration: "Release"
        includeSource: "true"
        packageFeedUrl: ${{ secrets.FRENDS_NUGET_FEED_URL }}
        packageFeedSecret: ${{ secrets.FRENDS_NUGET_FEED_KEY }}
